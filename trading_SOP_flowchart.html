<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易 SOP 流程圖 · 順勢加碼系統</title>
<style>
  :root{
    --bg:#0e1117; --panel:#1a1f2e; --panel2:#111827; --border:#2d3748;
    --ink:#e2e8f0; --ink2:#cbd5e1; --muted:#64748b;
    --blue:#60a5fa; --green:#4ade80; --amber:#fbbf24; --red:#f87171; --slate:#94a3b8;
    --violet:#c084fc; --teal:#2dd4bf;
  }
  html{ font-size:110%; }   /* 全域字級放大：想更大改 115%、想小回 100% */
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -140px,#141b2e 0%,transparent 70%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    display:flex; justify-content:center; padding:40px 16px 64px;
  }
  .wrap{max-width:880px; width:100%;}

  header.top{text-align:center; margin-bottom:30px;}
  header.top h1{font-size:1.4rem; letter-spacing:.16em; color:var(--blue); font-weight:800;}
  header.top .sub{color:var(--muted); font-size:.72rem; margin-top:8px; line-height:1.7;}
  .dash-link{
    display:inline-flex; align-items:center; gap:7px; margin-top:16px;
    background:#0b1220; border:1px solid var(--border); color:var(--blue);
    text-decoration:none; padding:9px 16px; border-radius:999px;
    font-size:.8rem; font-weight:600; transition:.15s;
  }
  .dash-link:hover{border-color:var(--blue); background:#101a2e;}
  .dash-link .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}

  .flow{display:flex; flex-direction:column; align-items:center;}
  .arrow{width:2px; height:24px; background:linear-gradient(var(--border),var(--slate)); position:relative;}
  .arrow::after{content:""; position:absolute; bottom:-1px; left:50%; transform:translateX(-50%);
    border-left:5px solid transparent; border-right:5px solid transparent; border-top:7px solid var(--slate);}

  .pill{
    background:var(--panel); border:1px solid var(--border); border-radius:999px;
    padding:9px 22px; font-size:.82rem; letter-spacing:.05em; color:var(--slate);
  }
  .pill.start{color:#e2e8f0; border-color:var(--slate); font-weight:600;}

  .node{
    width:100%; background:var(--panel); border:1px solid var(--border);
    border-left-width:4px; border-radius:12px; padding:18px 22px;
    position:relative;
  }
  .node .head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:9px;}
  .node .tag{font-size:.66rem; letter-spacing:.12em; color:var(--muted); font-weight:700;}
  .node h2{font-size:1.02rem;}
  .node p{font-size:.87rem; line-height:1.72; color:var(--ink2);}
  .node p b{color:#f1f5f9;}
  .node.blue{border-left-color:var(--blue);} .node.blue h2{color:var(--blue);}
  .node.green{border-left-color:var(--green);} .node.green h2{color:var(--green);}
  .node.amber{border-left-color:var(--amber);} .node.amber h2{color:var(--amber);}
  .node.red{border-left-color:var(--red);} .node.red h2{color:var(--red);}
  .node.teal{border-left-color:var(--teal);} .node.teal h2{color:var(--teal);}
  .node.violet{border-left-color:var(--violet); background:linear-gradient(180deg,#1a1330,#141020);}
  .node.violet h2{color:var(--violet);}

  .stepno{
    position:absolute; top:-11px; left:16px; background:var(--bg);
    border:1px solid var(--border); color:var(--slate);
    font-size:.64rem; font-weight:800; letter-spacing:.1em;
    padding:2px 9px; border-radius:999px;
  }

  .layers{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:2px 0 4px;}
  .layers .lchip{font-size:.68rem; color:var(--slate); background:#0b1220;
    border:1px solid var(--border); border-radius:999px; padding:4px 11px;}
  .layers .lchip b{color:#e2e8f0;}

  .matrix{width:100%; border-collapse:collapse; margin-top:12px; font-size:.74rem;}
  .matrix th,.matrix td{border:1px solid #3a2d55; padding:7px 8px; text-align:center;}
  .matrix th{background:#241a3d; color:#d8b4fe; font-weight:700;}
  .matrix td:first-child{background:#1c1530; color:#e9d5ff; font-weight:600; text-align:left;}
  .matrix td{color:#cbb8e6;}
  .matrix .hi{background:#2a1f47; color:#f0abfc;}
  .mcap{font-size:.7rem; color:#8b7aa8; margin-top:8px; line-height:1.6;}
  .rules-v{margin-top:12px; display:grid; gap:7px;}
  .rules-v .r{display:flex; gap:9px; font-size:.8rem; line-height:1.55; color:var(--ink2);}
  .rules-v .r .n{flex:none; width:18px; height:18px; border-radius:5px; background:#3b2d5c; color:#e9d5ff; font-size:.68rem; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:2px;}

  .decision{
    width:100%; text-align:center; background:var(--panel2);
    border:1px dashed var(--slate); border-radius:12px; padding:16px 20px;
  }
  .decision .q{font-size:.7rem; letter-spacing:.14em; color:var(--muted); font-weight:700; margin-bottom:6px;}
  .decision h2{font-size:1.0rem; color:var(--ink);}

  .lights{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%;}
  .light{border-radius:12px; padding:14px 16px; border:1px solid var(--border); background:var(--panel2);}
  .light .lh{display:flex; align-items:center; gap:8px; font-weight:700; font-size:.9rem; margin-bottom:7px;}
  .light .bulb{width:12px;height:12px;border-radius:50%;}
  .light.g{border-color:#1f6b3a;} .light.g .bulb{background:var(--green);box-shadow:0 0 7px var(--green);} .light.g .lh{color:var(--green);}
  .light.y{border-color:#7a5b12;} .light.y .bulb{background:var(--amber);box-shadow:0 0 7px var(--amber);} .light.y .lh{color:var(--amber);}
  .light.r{border-color:#7a1f1f;} .light.r .bulb{background:var(--red);box-shadow:0 0 7px var(--red);} .light.r .lh{color:var(--red);}
  .light p{font-size:.78rem; line-height:1.6; color:var(--ink2);}

  .split{display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%;}
  .branch-label{text-align:center; font-size:.72rem; color:var(--muted); letter-spacing:.1em; margin-bottom:-14px; margin-top:-4px;}

  .moments{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
  .moment{background:#0b1220; border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .moment .mt{font-size:.8rem; font-weight:700; color:var(--green); margin-bottom:5px;}
  .moment p{font-size:.77rem; line-height:1.55;}

  .addmap{width:100%; border-collapse:collapse; margin-top:12px; font-size:.73rem;}
  .addmap th,.addmap td{border:1px solid #234; padding:8px; text-align:center; line-height:1.4;}
  .addmap th{background:#0f1a2e; color:var(--slate); font-weight:700; font-size:.68rem;}
  .addmap td:first-child{background:#0f1a2e; color:var(--slate); font-weight:700; text-align:left; width:31%;}
  .addmap .zg{background:#0f2318; color:#86efac; font-weight:700;}
  .addmap .zy{background:#241d09; color:#fcd34d; font-weight:700;}
  .addmap .zr{background:#2a1414; color:#fca5a5; font-weight:700;}
  .addmap small{color:#93a3b8; font-weight:400;}

  .gate{
    width:100%; background:linear-gradient(90deg,#1c1408,#12100a); border:1px solid #7a5b12;
    border-radius:12px; padding:15px 20px; text-align:center;
  }
  .gate .glabel{font-size:.68rem; letter-spacing:.14em; color:var(--amber); font-weight:700; margin-bottom:6px;}
  .gate p{font-size:.86rem; line-height:1.6; color:var(--ink);}
  .gate b{color:#fde68a;}

  .clocks{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
  .clock{background:#0b1220; border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .clock .ct{font-size:.8rem; font-weight:700; margin-bottom:5px; display:flex; align-items:center; gap:7px;}
  .clock.core .ct{color:var(--red);}
  .clock.add .ct{color:var(--amber);}
  .clock p{font-size:.77rem; line-height:1.55; color:var(--ink2);}

  .tools{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px;}
  .tool{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    background:#0b1220; border:1px solid var(--border); color:var(--slate);
    font-size:.71rem; padding:5px 11px; border-radius:7px; transition:.15s;
  }
  .tool:hover{border-color:var(--blue); color:var(--blue);}
  .tool .ic{font-size:.7rem; opacity:.8;}
  .tool .num{background:#1e293b; color:#cbd5e1; border-radius:4px; padding:0 5px; font-weight:700;}

  .mantra{
    margin-top:30px; padding:18px 20px; text-align:center;
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    color:var(--slate); font-size:.8rem; line-height:1.9;
  }
  .mantra .big{color:#e2e8f0; letter-spacing:.05em; font-size:.88rem; font-weight:600;}
  .mantra .warn{color:var(--muted); font-size:.7rem;}
  footer.disc{text-align:center; color:var(--muted); font-size:.66rem; margin-top:18px; line-height:1.7;}

  @media (max-width:640px){
    .lights,.split,.moments,.clocks{grid-template-columns:1fr;}
    .addmap td:first-child{width:auto;}
  }
  @media print{
    body{background:#fff;color:#111;padding:0;}
    .wrap{max-width:100%;}
    .dash-link{display:none;}
    .node,.decision,.pill,.gate,.light,.moment,.tool,.mantra,.clock{background:#fff !important;}
    .node,.decision,.gate,.mantra,.light,.clock{border-color:#bbb !important;}
    .node p,.node h2,.decision h2,.gate p,.light p,.moment p,.clock p{color:#222 !important;}
    .tool{color:#333 !important;border-color:#ccc !important;}
    .node.violet{background:#faf5ff !important;}
    .matrix th{background:#f3e8ff !important;color:#333 !important;}
    .matrix td,.matrix td:first-child{background:#fff !important;color:#333 !important;}
    .matrix .hi{background:#f3e8ff !important;}
    .addmap th,.addmap td,.addmap td:first-child{background:#fff !important;color:#333 !important;}
    .addmap .zg{background:#e7f8ee !important;color:#166534 !important;}
    .addmap .zy{background:#fdf6e3 !important;color:#92600a !important;}
    .addmap .zr{background:#fdecec !important;color:#a12020 !important;}
    .rules-v .r{color:#333 !important;} .rules-v .r .n{background:#e9d5ff !important;color:#333 !important;}
    .mcap{color:#777 !important;}
    .stepno{background:#fff !important;color:#333 !important;}
    .arrow{background:#999;} .arrow::after{border-top-color:#999;}
    .editbar,.edithint{display:none !important;}
  }

  /* 視覺編輯器工具列 */
  .editbar{position:fixed; top:14px; right:14px; display:flex; gap:8px; z-index:9999;}
  .editbar button{
    font-family:inherit; font-size:.8rem; font-weight:700; cursor:pointer;
    border:1px solid var(--border); background:#0b1220; color:var(--ink);
    padding:9px 14px; border-radius:9px; box-shadow:0 4px 14px rgba(0,0,0,.4); transition:.15s;
  }
  .editbar button:hover{border-color:var(--teal); color:var(--teal);}
  .editbar #btnSave{background:#0f2318; border-color:#1f6b3a; color:#86efac;}
  .edithint{
    position:fixed; left:50%; top:14px; transform:translateX(-50%); z-index:9999;
    background:#0b1220; border:1px solid var(--teal); color:var(--teal);
    font-size:.76rem; padding:8px 16px; border-radius:999px; display:none;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  body.is-editing .edithint{display:block;}
  body.is-editing [data-k]{
    outline:1px dashed var(--teal); outline-offset:3px; border-radius:3px;
    cursor:text; background:rgba(45,212,191,.05);
  }
  body.is-editing [data-k]:hover{background:rgba(45,212,191,.12);}
</style>
</head>

  b_m1t: `① 創新高（加小資金）`,
  b_m1p: `突破箱型創新高＋ATR波動正常時，加一點小資金。`,
  b_m2t: `② 回季線站穩（加大資金）`,

  am_ch1: `波動收縮<br><small>擴張度低 · ATR5&lt;ATR14 見頂回落</small>`,

<!-- 視覺編輯器：點「編輯文字」直接在圖上改，再「下載」存新檔。不用動這段。 -->
<script>
  (function(){
    var editing=false;
    var btnEdit=document.getElementById('btnEdit');
    var btnSave=document.getElementById('btnSave');

    function esc(v){ return v.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$\{/g,'\\${'); }

    function doSave(){
      var newC={};
      document.querySelectorAll('[data-k]').forEach(function(el){
        newC[el.getAttribute('data-k')] = el.innerHTML.trim();
      });
      var block='const C = {\n';
      Object.keys(newC).forEach(function(k){ block += '  '+k+': `'+esc(newC[k])+'`,\n'; });
      block += '};';

      var root=document.documentElement.cloneNode(true);
      root.querySelectorAll('[data-k]').forEach(function(el){
        el.removeAttribute('contenteditable'); el.innerHTML='';
      });
      var b=root.querySelector('body'); if(b) b.classList.remove('is-editing');
      var be=root.querySelector('#btnEdit'); if(be) be.textContent='✏️ 編輯文字';
      var bs=root.querySelector('#btnSave'); if(bs) bs.setAttribute('style','display:none');
      var cb=root.querySelector('#copyblock'); if(cb) cb.textContent='\n'+block+'\n';

      var html='<!DOCTYPE html>\n'+root.outerHTML;
      var blob=new Blob([html],{type:'text/html;charset=utf-8'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='trading_SOP_flowchart.html';
      document.body.appendChild(a); a.click(); a.remove();
    }

    btnEdit.addEventListener('click', function(){
      if(!editing){
        editing=true;
        document.querySelectorAll('[data-k]').forEach(function(el){ el.setAttribute('contenteditable','true'); });
        document.body.classList.add('is-editing');
        btnEdit.textContent='✅ 完成並存檔';
        btnSave.style.display='inline-block';
      } else {
        editing=false;
        document.querySelectorAll('[data-k]').forEach(function(el){ el.removeAttribute('contenteditable'); });
        document.body.classList.remove('is-editing');
        btnEdit.textContent='✏️ 編輯文字';
        btnSave.style.display='none';
        doSave();   /* 按「完成」自動下載新檔 */
      }
    });

    btnSave.addEventListener('click', doSave);
  })();
</script>
