name: 怪物股宇宙名單同步

# 每個美股交易日收盤後跑一次：
#   23:40 UTC = 台北 07:40（週二～週六）= 美東 19:40（週一～週五，收盤後 3.5 小時，Yahoo 資料已補齊）
# 也可以在 GitHub → Actions 分頁手動按 Run workflow。
on:
  schedule:
    - cron: "40 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write          # 只需要這個：把 data/monster_universe.json commit 回 repo

concurrency:
  group: universe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 yfinance
        run: pip install --quiet yfinance

      - name: 向 Yahoo 篩選器抓名單（寫到 data/）
        run: python sync_universe.py --local

      - name: 有變更才 commit + push
        run: |
          if git diff --quiet -- data/monster_universe.json; then
            echo "名單無變化，略過 commit（Streamlit 不會重新部署）。"
            exit 0
          fi
          git config user.name  "universe-bot"
          git config user.email "universe-bot@users.noreply.github.com"
          git add data/monster_universe.json
          git commit -m "universe $(date -u +%F) [auto]"
          # 推之前先把遠端新 commit 接上來（例如同時有人在推頁面），避免 non-fast-forward 被拒
          git pull --rebase origin main
          git push
